<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Briefing · MN90 Mobile</title>
<script src="../shared/theme.js"></script>
<link rel="stylesheet" href="../shared/style.css">
<script src="../shared/mn90.js" defer></script>
<script src="../shared/profile.js" defer></script>
<style>
  .bf-app { padding: 12px 16px 30px; max-width: 1800px; margin: 0 auto; }
  .bf-head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 12px; }
  .bf-head .seg { min-width: 260px; }
  .bf-prog { flex: 1; min-width: 200px; display: flex; align-items: center; gap: 8px; font-weight: 700; }
  .bf-prog .bar { flex: 1; height: 8px; border-radius: 4px; background: var(--surface2); overflow: hidden; }
  .bf-prog .bar i { display: block; height: 100%; background: var(--ok); width: 0; transition: width .2s; }
  .bf-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 290px), 1fr)); gap: 12px; }
  .bf-card { padding: 12px; }
  .bf-card h2 { display: flex; justify-content: space-between; align-items: center; }
  .bf-card h2 small { font-size: .78rem; color: var(--text2); text-transform: none; letter-spacing: 0; }
  .bf-card.done { border-color: var(--ok); }
  .bf-item { display: flex; gap: 9px; align-items: flex-start; padding: 6px 4px; border-bottom: 1px solid var(--border); cursor: pointer; font-size: .92rem; }
  .bf-item:last-child { border-bottom: 0; }
  .bf-item input { margin-top: 3px; width: 18px; height: 18px; accent-color: var(--ok); flex-shrink: 0; }
  .bf-item.on span { color: var(--text2); text-decoration: line-through; }
  .bf-item b { color: var(--accent); }
  .bf-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  /* Calcul intégré : on reste sur le briefing */
  .bf-calc { padding: 12px; margin-bottom: 12px; }
  .bf-calc h2 { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .bf-in { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; margin: 8px 0 10px; }
  .bf-in label { display: flex; flex-direction: column; gap: 3px; font-size: .8rem; font-weight: 700; color: var(--text2); }
  .bf-in input { width: 100%; font-size: 1rem; }
  .bf-out { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 170px), 1fr)); gap: 8px; }
  .bf-out > div { border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; background: var(--bg2); }
  .bf-out > div.key { border: 2px solid var(--accent); }
  .bf-out span { display: block; font-size: .75rem; color: var(--text2); font-weight: 700; text-transform: uppercase; letter-spacing: .03em; }
  .bf-out b.v { display: block; font-size: 1.5rem; line-height: 1.15; color: var(--accent); font-variant-numeric: tabular-nums; }
  .bf-out small { display: block; font-size: .8rem; color: var(--text2); }
  .bf-note { margin-top: 8px; font-size: .85rem; }
  .bf-calc .alert { margin-top: 8px; }
</style>
</head>
<body>

<nav class="navbar">
  <a class="nav-back" href="../index.html">← Accueil</a>
  <span class="nav-title">🗣️ Briefing</span>
  <div class="navbar-actions">
    <a class="nav-sos" href="../procedures/index.html" title="Procédures d’urgence"><span aria-hidden="true">🚨</span><span class="nav-sos-txt"> Procédures</span></a>
    <button type="button" class="profile-chip">🤿 Mon profil</button>
    <div class="theme-picker">
      <button type="button" class="theme-btn" aria-label="Changer de thème">🎨</button>
      <div class="theme-dropdown"></div>
    </div>
  </div>
</nav>

<main class="bf-app">
  <div class="bf-head">
    <div class="seg" id="lvl">
      <button type="button" data-v="n2">Briefing Niveau 2</button>
      <button type="button" data-v="n3">Briefing Niveau 3</button>
    </div>
    <div class="bf-prog"><span id="progTxt"></span><div class="bar"><i id="progBar"></i></div></div>
    <div class="bf-actions">
      <button type="button" class="btn btn-outline btn-sm" id="reset">↺ Tout décocher</button>
    </div>
  </div>
  <section class="card bf-calc" id="calc">
    <h2>🧮 DTR, décollage et mi-pression <small class="muted" style="font-weight:600;text-transform:none;letter-spacing:0">calculé ici, sans quitter le briefing</small></h2>
    <div class="bf-in">
      <label>Profondeur (m)<input class="input" type="number" inputmode="numeric" data-c="depth" min="6" max="65" step="1"></label>
      <label>Durée au fond (min)<input class="input" type="number" inputmode="numeric" data-c="time" min="1" max="120" step="1"></label>
      <label>% O₂ (21 = air)<input class="input" type="number" inputmode="numeric" data-c="o2" min="21" max="40" step="1"></label>
      <label>Bloc (L)<input class="input" type="number" inputmode="numeric" data-c="tank" min="3" max="40" step="1"></label>
      <label>Pression départ (b)<input class="input" type="number" inputmode="numeric" data-c="press" min="50" max="300" step="10"></label>
      <label>Conso (L/min)<input class="input" type="number" inputmode="numeric" data-c="sac" min="5" max="60" step="1"></label>
      <label>Réserve (b)<input class="input" type="number" inputmode="numeric" data-c="reserve" min="0" max="150" step="10"></label>
    </div>
    <div id="calcOut"></div>
  </section>
  <div class="bf-grid" id="grid"></div>
</main>

<script>
(function () {
  'use strict';
  // Briefings de la planche mémo (N2 et N3), étape par étape
  const BRIEF = {
    n2: [
      ['🤝 Social', ['Expérience : dernière plongée ? Combien ?', 'Expérience : souvent ?', 'Où ça ? (selon l’endroit, on ne réagit pas pareil)', 'Première de la journée ?', 'Niveau ?', 'Consommation d’air ? Qui limite ?']],
      ['🧰 Matériel', ['Matériel de location ou perso ?', 'Où sont les purges ?', 'Lestage : ceinture ou poches ?', 'Buddy check : <b>Bouée, Air, Lestage, Largage, OK</b>', 'Ordinateur de plongée ?', 'Combinaison perso ou location ?', 'Gestes PADI ou FFESSM ?']],
      ['🌊 Immersion', ['Rappel des directives du DP : xx minutes / xx m', 'Immersion : saut droit ou phoque ?', 'Bubble check à 5 m ? (bulles, ordi, respiration, oreilles)', 'On se retrouve où ?']],
      ['🧭 Explo', ['Quel trajet ? Objectif ?', 'On évolue comment ? Triangle, stick together ? Signe ?', 'On est à un écart de bras', 'Si on se perd : remontée de 2 m, 360° pendant 1 min, puis parachute si besoin et surface', 'À <b>mi-pression</b>, on fait demi-tour', 'Palier de sécurité ?', 'Qui tire le parachute ? À 8 m ?']],
      ['🏁 Sortie', ['Débriefing']],
    ],
    n3: [
      ['🤝 Social', ['État physique et psychique', 'Niveau / expérience / historique', 'Intérêt : pourquoi 60 m ?', 'Consommation et oreilles', 'Matériel (sans changement)', 'Ordinateur (planification, pré-dive pour les paliers)', 'Topo du site / points d’intérêt', '<b>BALAO</b> : Bouée, Air, Lestage, Accessoires, OK ?']],
      ['🌊 Mise à l’eau et descente', ['Technique (saut droit / bascule arrière)', 'Rassemblement ? Où ?', 'Selon la mer : positif ou négatif', 'Descente phoque ou canard / avec ou sans bout', 'Check à 6 m (air, ordi, phare, bulles)', 'Stop à 40 m (check mano, narcose)', 'Descente toujours en se surveillant et à la même vitesse']],
      ['⚓ Fond', ['Narcose / froid / effort / panne d’air', 'Position de la palanquée / déplacement', 'Perte de palanquée / trajet / topo', 'Communication (gestes)']],
      ['⏱️ Décollage', ['<b>DTR</b> / <b>pression de décollage</b> (à combien on décolle), qui sera notre réserve / <b>mi-pression</b>', 'Paliers profonds / paliers de sécurité']],
      ['⬆️ Remontée', ['Remontée toujours en se surveillant, à la même vitesse', 'Vitesse ordi', 'Signes du 1er (le plus profond)', 'Parachute et paliers : entre 6 et 7 m, entre 4 et 5 m ? 360° ?', 'OK de surface', 'Mains sur les purges pour une réimmersion d’urgence', 'Détendeur et masque sur le visage', 'Remontée sur le bateau']],
      ['💬 Feedback', ['Mi-pression / DTR / pression de réserve', 'Vitesse de remontée', 'Perte de palanquée']],
    ],
  };
  const KEY = 'mn90-briefing';
  let st;
  try { st = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { st = {}; }
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) { /* rien */ } };

  function init() {
    const grid = document.getElementById('grid'), lvl = document.getElementById('lvl');
    const progTxt = document.getElementById('progTxt'), progBar = document.getElementById('progBar');
    if (!grid || !lvl || !progTxt || !progBar) return;
    const P = window.MN90Profile;
    const lv = P ? P.get().level : '';
    let cur = st.cur || (['N3', 'N4', 'MF'].includes(lv) ? 'n3' : 'n2');
    function render() {
      lvl.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.v === cur));
      const done = st[cur] || {};
      let n = 0, ok = 0;
      grid.innerHTML = BRIEF[cur].map(([title, items], si) => {
        const c = items.filter((_, ii) => done[si + '.' + ii]).length;
        n += items.length; ok += c;
        return `<section class="card bf-card${c === items.length ? ' done' : ''}"><h2>${title} <small>${c}/${items.length}</small></h2>` +
          items.map((it, ii) => `<label class="bf-item${done[si + '.' + ii] ? ' on' : ''}"><input type="checkbox" data-k="${si}.${ii}"${done[si + '.' + ii] ? ' checked' : ''}><span>${it}</span></label>`).join('') + '</section>';
      }).join('');
      progTxt.textContent = `${ok} / ${n} vérifiés`;
      progBar.style.width = (n ? ok / n * 100 : 0) + '%';
    }
    lvl.addEventListener('click', e => { const b = e.target.closest('button'); if (b) { cur = b.dataset.v; st.cur = cur; save(); render(); } });
    grid.addEventListener('change', e => {
      const k = e.target.dataset && e.target.dataset.k;
      if (!k) return;
      st[cur] = st[cur] || {};
      if (e.target.checked) st[cur][k] = 1; else delete st[cur][k];
      save(); render();
    });
    document.getElementById('reset').addEventListener('click', () => { st[cur] = {}; save(); render(); });
    render();
    initCalc();
  }
  /* ---------- Calcul de briefing : table MN90, Tito, mi-pression ---------- */
  function initCalc() {
    const box = document.getElementById('calc'), out = document.getElementById('calcOut');
    const L = window.MN90Lib, P = window.MN90Profile;
    if (!box || !out) return;
    if (!L) { box.hidden = true; return; }
    const g0 = P ? P.get().gear : { tank: 15, press: 200, sac: 20, reserve: 50 };
    const def = { depth: 40, time: 20, o2: 21, tank: g0.tank, press: g0.press, sac: g0.sac, reserve: g0.reserve };
    const v = Object.assign({}, def, st.calc || {});
    const inputs = box.querySelectorAll('[data-c]');
    inputs.forEach(i => { i.value = v[i.dataset.c]; });
    const fmt = L.fmt;
    const num = (i, d) => { const x = parseFloat(i.value); const lo = +i.min, hi = +i.max; return Number.isFinite(x) ? Math.min(hi, Math.max(lo, x)) : d; };
    function calc() {
      const c = {};
      inputs.forEach(i => { c[i.dataset.c] = num(i, def[i.dataset.c]); });
      st.calc = c; save();
      const fo2 = c.o2 / 100, nitrox = c.o2 > 21;
      const gear = { tank: c.tank, press: c.press, sac: c.sac, reserve: c.reserve };
      const r = L.evaluate({ bottom: L.squareBottom(c.depth, c.time), fo2, nitrox, gear });
      const pp = L.ppo2At(c.depth, fo2);
      if (r.tab.err || !r.prof) { out.innerHTML = `<div class="alert danger">${r.tab.err || 'Plongée hors table.'}</div>`; return; }
      const d = L.decollage(r, gear);
      const tito = Math.ceil(d.tito / 10) * 10, min = Math.ceil(d.exact);
      const pdeco = Math.max(tito, min);
      const pBottom = c.press - L.gasUse(L.squareBottom(c.depth, c.time), c.sac) / c.tank;
      const half = Math.round(c.press / 2), halfTrip = Math.round((c.press + pdeco) / 2);
      const st0 = L.stopList(r.tab.stops);
      const stops = st0.length ? st0.map(z => `<b class="pd${z}">${z} m ${r.tab.stops[z]}′</b>`).join(' + ') : 'aucun palier obligatoire';
      const read = nitrox ? `PEA ${fmt(r.pea, 1)} m → ligne ${r.tab.d} m / ${r.tab.t}′` : `ligne ${r.tab.d} m / ${r.tab.t}′`;
      const dtrReal = Math.ceil(r.dtrReal - 1e-9);
      out.innerHTML = `<div class="bf-out">
          <div><span>Table MN90</span><b class="v">${r.tab.dtr}′ DTR</b><small>${read} · ${stops} · GPS ${r.tab.gps}${nitrox && dtrReal !== r.tab.dtr ? ` · DTR réelle ≈ ${dtrReal}′` : ''}</small></div>
          <div class="key"><span>Pression de décollage</span><b class="v">${pdeco} b</b><small>Tito : ${c.depth} + 2 × ${d.dtr} = ${fmt(d.tito, 0)} → ${tito} b${tito < min ? ` · relevée au minimum exact ${min} b (bloc ${c.tank} L)` : ` · minimum exact ${min} b`}</small></div>
          <div><span>Mi-pression</span><b class="v">${half} b</b><small>moitié de ${c.press} b · aller-retour : demi-tour à (${c.press} + ${pdeco}) / 2 = ${halfTrip} b</small></div>
          <div><span>Au départ du fond</span><b class="v" style="color:${pBottom < min ? 'var(--danger)' : pBottom < pdeco ? 'var(--warn)' : 'var(--ok)'}">≈ ${Math.round(pBottom)} b</b><small>${c.time} min à ${c.depth} m avec ${c.sac} L/min · surface ≈ ${Math.round(r.left)} b</small></div>
        </div>
        ${pp > 1.6 + 1e-9 ? `<div class="alert danger">PpO₂ ${fmt(pp, 2)} b au fond : au-delà de 1,6 b, mélange interdit à cette profondeur (MOD ${fmt(L.mod(fo2, 1.6), 1)} m).</div>` : ''}
        ${pBottom < min ? `<div class="alert danger">Pas assez d’air : ${Math.round(pBottom)} b au départ du fond pour ${min} b nécessaires. Raccourcis la plongée.</div>` : pBottom < pdeco ? `<div class="alert warn">Avec ≈ ${Math.round(pBottom)} b au départ du fond, c’est la pression (${pdeco} b) qui fera décoller avant le temps.</div>` : ''}
        <p class="bf-note">🔑 Contrat à annoncer : <b>${c.time} min au fond OU ${pdeco} b au manomètre</b>, le premier des deux fait décoller.</p>`;
    }
    box.addEventListener('input', calc);
    calc();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();
</script>
</body>
</html>
