<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Nitrox Calc</title>
<meta name="description" content="Calculatrice de révision Nitrox Confirmé : les énoncés types du cours, ligne par ligne.">
<meta name="theme-color" content="#0b1418">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root { --bg: #0b1418; --key: #1d2a30; --key2: #26363d; --txt: #f2f7f8; --txt2: #8fa5ad; --acc: #2ec4d6; --acc2: #0e8fa0; --warn: #ffb347; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--txt); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
  .app { height: 100dvh; display: flex; flex-direction: column; max-width: 560px; margin: 0 auto; padding: env(safe-area-inset-top) 12px calc(10px + env(safe-area-inset-bottom)); }
  header { display: flex; align-items: baseline; gap: 22px; padding: 14px 4px 10px; flex: 0 0 auto; }
  header .nom { color: #5d7178; font-size: .8rem; font-weight: 600; margin-right: auto; }
  header button { border: 0; background: none; padding: 0; font: inherit; font-size: 1.3rem; font-weight: 700; color: #5d7178; cursor: pointer; }
  header button.on { color: var(--txt); }
  .vue { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
  .vue[hidden] { display: none; }
  #liste { overflow-y: auto; display: flex; flex-direction: column; }
  #liste button { border: 0; border-bottom: 1px solid #1d2a30; background: none; color: var(--txt); text-align: left; padding: 14px 4px; font-size: 1.05rem; cursor: pointer; }
  #liste button small { display: block; color: var(--txt2); font-size: .8rem; margin-top: 2px; }
  #liste button.on { color: var(--acc); }
  #ruban { flex: 1 1 auto; min-height: 60px; overflow-y: auto; padding: 4px 2px 6px; display: flex; flex-direction: column; gap: 3px; font-variant-numeric: tabular-nums; }
  #ruban > :first-child { margin-top: auto; }
  .r-h { color: var(--acc); font-weight: 700; font-size: .86rem; margin-top: 8px; }
  .r-t { color: var(--txt2); font-size: .9rem; }
  .r-v { display: flex; justify-content: space-between; gap: 10px; font-size: .9rem; color: var(--txt2); }
  .r-v b { color: var(--txt); font-weight: 600; }
  .r-l { display: flex; flex-wrap: wrap; justify-content: flex-end; align-items: baseline; gap: 6px; font-size: 1.08rem; text-align: right; }
  .r-l .k { color: #cfe0e4; }
  .r-l .eg { color: var(--txt2); }
  .r-l b { color: #fff; font-weight: 600; }
  .r-l small, .r-t small { flex-basis: 100%; display: block; color: var(--warn); font-size: .78rem; text-align: right; }
  .r-t small { text-align: left; }
  .r-rep { margin-top: 6px; text-align: right; font-weight: 700; font-size: 1.15rem; color: var(--acc); }
  .r-x { margin-top: 6px; color: var(--warn); font-size: .86rem; line-height: 1.4; }
  #invite { color: var(--acc); font-size: .86rem; font-weight: 700; text-align: right; min-height: 1.2em; padding-top: 4px; }
  #invite, #affichage { flex: 0 0 auto; }
  #affichage { line-height: 1.2; overflow-y: hidden; font-size: clamp(2rem, 11vw, 3.2rem); font-weight: 600; text-align: right; padding: 0 2px 8px; white-space: nowrap; overflow-x: auto; scrollbar-width: none; font-variant-numeric: tabular-nums; }
  #affichage.vide { color: #5d7178; }
  #affichage.err { color: #ff6b6b; }
  #clavier { display: grid; grid-template-columns: repeat(4, 1fr); gap: 9px; flex: 0 0 auto; }
  .t { height: min(10.5vh, 68px); border: 0; border-radius: 18px; background: var(--key); color: var(--txt); font-size: 1.6rem; font-weight: 600; cursor: pointer; user-select: none; touch-action: manipulation; }
  .t:active { filter: brightness(1.35); }
  .t.fn { color: var(--acc); background: var(--key2); font-size: 1.3rem; }
  .t.op { color: var(--acc); font-size: 1.8rem; }
  .t.egal { grid-column: 1 / -1; background: var(--acc); color: #04252b; font-weight: 800; font-size: 1.9rem; height: min(9vh, 58px); }
</style>
<script src="../shared/mn90.js" defer></script>
<script src="../nitrox/examen.js" defer></script>
<script src="app.js" defer></script>
</head>
<body>
<div class="app">
  <header>
    <span class="nom">Nitrox Calc</span>
    <button type="button" data-vue="calc" class="on">Calculatrice</button>
    <button type="button" data-vue="enonces">Énoncés</button>
  </header>
  <div class="vue" data-vue="calc">
    <div id="ruban" aria-live="polite"></div>
    <div id="invite"></div>
    <div id="affichage">0</div>
    <div id="clavier"></div>
  </div>
  <div class="vue" data-vue="enonces" hidden>
    <nav id="liste" aria-label="Énoncés"></nav>
  </div>
</div>
</body>
</html>
